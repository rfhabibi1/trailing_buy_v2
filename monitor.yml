name: Trailing Start Monitor

on:
  schedule:
    # Jam bursa Indonesia (WIB = UTC+7): 09:00-16:15 WIB = 02:00-09:15 UTC
    # Cron minimum interval GitHub Actions adalah 5 menit
    - cron: '*/5 2-9 * * 1-5'   # Setiap 5 menit, jam 02:00-09:59 UTC, Senin-Jumat
  workflow_dispatch:            # Supaya bisa trigger manual dari tab Actions untuk testing

permissions:
  contents: write   # Diperlukan supaya workflow bisa commit state file balik ke repo

jobs:
  check-breakout:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance requests pandas numpy

      - name: Jalankan pengecekan breakout
        env:
          TICKER: ${{ vars.TICKER }}
          INTRADAY_INTERVAL: ${{ vars.INTRADAY_INTERVAL }}
          INTRADAY_PERIOD_DAYS: ${{ vars.INTRADAY_PERIOD_DAYS }}
          INTRADAY_LOOKBACK_BARS: ${{ vars.INTRADAY_LOOKBACK_BARS }}
          BREAKOUT_PERCENT: ${{ vars.BREAKOUT_PERCENT }}
          ENABLE_VOLUME_FILTER: ${{ vars.ENABLE_VOLUME_FILTER }}
          VOLUME_LOOKBACK_BARS: ${{ vars.VOLUME_LOOKBACK_BARS }}
          VOLUME_MULTIPLIER: ${{ vars.VOLUME_MULTIPLIER }}
          ENABLE_CLOSE_CONFIRMATION: ${{ vars.ENABLE_CLOSE_CONFIRMATION }}
          ENABLE_MTF_FILTER: ${{ vars.ENABLE_MTF_FILTER }}
          MTF_SMA_WEEKS: ${{ vars.MTF_SMA_WEEKS }}
          DAILY_PERIOD_DAYS: ${{ vars.DAILY_PERIOD_DAYS }}
          ENABLE_ATR_THRESHOLD: ${{ vars.ENABLE_ATR_THRESHOLD }}
          ATR_PERIOD: ${{ vars.ATR_PERIOD }}
          ATR_MULTIPLIER: ${{ vars.ATR_MULTIPLIER }}
          ENABLE_OBV_FILTER: ${{ vars.ENABLE_OBV_FILTER }}
          OBV_SMA_PERIOD: ${{ vars.OBV_SMA_PERIOD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python trailing_start_check_once.py

      - name: Commit state file jika berubah
        run: |
          git config user.name "trailing-start-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/trailing_start_state.json
          git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git push
        continue-on-error: true   # Jangan gagalkan workflow kalau tidak ada perubahan
