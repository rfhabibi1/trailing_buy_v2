name: Trailing Start Monitor

on:
  schedule:
    # Jam bursa Indonesia (WIB = UTC+7): 09:00-16:00 WIB = 02:00-09:00 UTC
    # Cron: setiap 5 menit, jam 02:00-08:59 UTC, Senin-Jumat
    - cron: '*/5 2-8 * * 1-5'
  workflow_dispatch:

jobs:
  check-breakout:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance requests pandas numpy

      - name: Create state directory
        run: |
          mkdir -p state
          # Buat state file untuk setiap ticker di TICKERS
          if [ -n "${{ vars.TICKERS }}" ]; then
            IFS=',' read -ra TICKER_LIST <<< "${{ vars.TICKERS }}"
            for ticker in "${TICKER_LIST[@]}"; do
              ticker_clean=$(echo "$ticker" | tr '.' '_' | xargs)
              state_file="state/trailing_start_state_${ticker_clean}.json"
              if [ ! -f "$state_file" ]; then
                echo '{"last_alert_time": null, "last_lowest_low": null, "last_price": null}' > "$state_file"
              fi
            done
          else
            if [ ! -f "state/trailing_start_state_TINS_JK.json" ]; then
              echo '{"last_alert_time": null, "last_lowest_low": null, "last_price": null}' > state/trailing_start_state_TINS_JK.json
            fi
          fi
        shell: bash

      - name: Run breakout checker
        env:
          # --- MULTI-TICKER ---
          TICKERS: ${{ vars.TICKERS }}
          MAX_TICKERS: ${{ vars.MAX_TICKERS }}
          
          # --- DATA INTRADAY ---
          INTRADAY_INTERVAL: ${{ vars.INTRADAY_INTERVAL }}
          INTRADAY_PERIOD_DAYS: ${{ vars.INTRADAY_PERIOD_DAYS }}
          INTRADAY_LOOKBACK_BARS: ${{ vars.INTRADAY_LOOKBACK_BARS }}
          BREAKOUT_PERCENT: ${{ vars.BREAKOUT_PERCENT }}
          USE_INTRADAY_LOW: ${{ vars.USE_INTRADAY_LOW }}
          
          # --- FILTER 1: VOLUME RATIO ---
          ENABLE_VOLUME_FILTER: ${{ vars.ENABLE_VOLUME_FILTER }}
          VOLUME_LOOKBACK_BARS: ${{ vars.VOLUME_LOOKBACK_BARS }}
          VOLUME_MULTIPLIER: ${{ vars.VOLUME_MULTIPLIER }}
          
          # --- FILTER 2: VOLUME SPIKE ---
          ENABLE_VOLUME_SPIKE: ${{ vars.ENABLE_VOLUME_SPIKE }}
          VOLUME_SPIKE_THRESHOLD: ${{ vars.VOLUME_SPIKE_THRESHOLD }}
          VOLUME_SPIKE_LOOKBACK: ${{ vars.VOLUME_SPIKE_LOOKBACK }}
          
          # --- FILTER 3: VOLUME TREND ---
          ENABLE_VOLUME_TREND: ${{ vars.ENABLE_VOLUME_TREND }}
          VOLUME_TREND_BARS: ${{ vars.VOLUME_TREND_BARS }}
          
          # --- FILTER 4: VWAP ---
          ENABLE_VWAP_FILTER: ${{ vars.ENABLE_VWAP_FILTER }}
          VWAP_LOOKBACK_BARS: ${{ vars.VWAP_LOOKBACK_BARS }}
          
          # --- FILTER 5: CVD ---
          ENABLE_CVD_FILTER: ${{ vars.ENABLE_CVD_FILTER }}
          CVD_LOOKBACK_BARS: ${{ vars.CVD_LOOKBACK_BARS }}
          CVD_BUY_THRESHOLD: ${{ vars.CVD_BUY_THRESHOLD }}
          
          # --- FILTER 6: MT VOLUME ---
          ENABLE_MT_VOLUME: ${{ vars.ENABLE_MT_VOLUME }}
          MT_VOLUME_DAILY_LOOKBACK: ${{ vars.MT_VOLUME_DAILY_LOOKBACK }}
          MT_VOLUME_DAILY_MULTIPLIER: ${{ vars.MT_VOLUME_DAILY_MULTIPLIER }}
          
          # --- FILTER 7: VOLUME-PRICE CORRELATION ---
          ENABLE_VOLUME_PRICE_CORRELATION: ${{ vars.ENABLE_VOLUME_PRICE_CORRELATION }}
          VOLUME_PRICE_CORR_BARS: ${{ vars.VOLUME_PRICE_CORR_BARS }}
          
          # --- CLOSE CONFIRMATION ---
          ENABLE_CLOSE_CONFIRMATION: ${{ vars.ENABLE_CLOSE_CONFIRMATION }}
          
          # --- MTF FILTER ---
          ENABLE_MTF_FILTER: ${{ vars.ENABLE_MTF_FILTER }}
          MTF_SMA_WEEKS: ${{ vars.MTF_SMA_WEEKS }}
          
          # --- ATR ---
          ENABLE_ATR_THRESHOLD: ${{ vars.ENABLE_ATR_THRESHOLD }}
          ATR_PERIOD: ${{ vars.ATR_PERIOD }}
          ATR_MULTIPLIER: ${{ vars.ATR_MULTIPLIER }}
          
          # --- OBV ---
          ENABLE_OBV_FILTER: ${{ vars.ENABLE_OBV_FILTER }}
          OBV_SMA_PERIOD: ${{ vars.OBV_SMA_PERIOD }}
          
          # --- LIQUIDITY ---
          ENABLE_LIQUIDITY_CHECK: ${{ vars.ENABLE_LIQUIDITY_CHECK }}
          MIN_INTRADAY_BARS: ${{ vars.MIN_INTRADAY_BARS }}
          MAX_ZERO_VOLUME_BAR_RATIO: ${{ vars.MAX_ZERO_VOLUME_BAR_RATIO }}
          MIN_AVG_DAILY_VALUE_RP: ${{ vars.MIN_AVG_DAILY_VALUE_RP }}
          LIQUIDITY_LOOKBACK_DAYS: ${{ vars.LIQUIDITY_LOOKBACK_DAYS }}
          
          # --- DAILY PERIOD ---
          DAILY_PERIOD_DAYS: ${{ vars.DAILY_PERIOD_DAYS }}
          
          # --- STRENGTH SCORE ---
          ENABLE_STRENGTH_SCORE: ${{ vars.ENABLE_STRENGTH_SCORE }}
          STRONG_SCORE_THRESHOLD: ${{ vars.STRONG_SCORE_THRESHOLD }}
          MODERATE_SCORE_THRESHOLD: ${{ vars.MODERATE_SCORE_THRESHOLD }}
          
          # --- BATCH ---
          BATCH_DELAY_SECONDS: ${{ vars.BATCH_DELAY_SECONDS }}
          
          # --- TELEGRAM ---
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          
        run: python trailing_start_check_once.py
