name: Test Breakout Simulation

on:
  workflow_dispatch:

jobs:
  test-breakout:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance requests pandas numpy

      - name: Run Breakout Simulation Test
        env:
          TICKERS: ${{ vars.TICKERS }}
          INTRADAY_INTERVAL: ${{ vars.INTRADAY_INTERVAL }}
          INTRADAY_LOOKBACK_BARS: ${{ vars.INTRADAY_LOOKBACK_BARS }}
          BREAKOUT_PERCENT: ${{ vars.BREAKOUT_PERCENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python test_breakout_simulation.py
